query GoldilendNFTsOwned($owner: String!) {
  bondBeras(where: { owner: $owner }, orderDirection: "desc") {
    items {
      id
      owner
    }
  }
  bandBeras(where: { owner: $owner }, orderDirection: "desc") {
    items {
      id
      owner
    }
  }
  beradromes(where: { owner: $owner }, orderDirection: "desc") {
    items {
      id
      owner
    }
  }
  honeycombs(where: { owner: $owner }, orderDirection: "desc") {
    items {
      id
      owner
    }
  }
}

query GetDailyEndPrices(
  $firstStart: BigInt
  $firstEnd: BigInt
  $secondStart: BigInt
  $secondEnd: BigInt
  $thirdStart: BigInt
  $thirdEnd: BigInt
  $fourthStart: BigInt
  $fourthEnd: BigInt
  $fifthStart: BigInt
  $fifthEnd: BigInt
  $sixthStart: BigInt
  $sixthEnd: BigInt
  $seventhStart: BigInt
  $seventhEnd: BigInt
) {
	firstDay: goldiswapTxes(
    where: {
    	AND: [
     		{ timestamp_gte: $firstStart },
     		{ timestamp_lt: $firstEnd }
    	]
    },
    orderBy: "timestamp",
    orderDirection: "desc",
    limit: 1
  ) {
    items {
      txType
      fsl
      psl
      supply
      timestamp
    }
  }
	secondDay: goldiswapTxes(
    where: {
    	AND: [
     		{ timestamp_gte: $secondStart },
     		{ timestamp_lt: $secondEnd }
